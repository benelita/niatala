version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: niatala-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-niatala_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_secure_change}
      POSTGRES_DB: ${DB_NAME:-niatala}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      # Volume persistant pour les données
      - niatala_postgres_data:/var/lib/postgresql/data
      # Initialisation SQL si besoin
      - ./backend/scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-niatala_dev} -d ${DB_NAME:-niatala}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - niatala_network
    restart: unless-stopped

volumes:
  niatala_postgres_data:
    driver: local

networks:
  niatala_network:
    driver: bridge
